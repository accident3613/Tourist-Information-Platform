<!-- 订单管理页面 -->
<div class="content-card">
    <div class="card-header">
        <h3 class="card-title">订单列表</h3>
        <div style="display: flex; gap: 10px;">
            <select id="filterStatus" onchange="loadOrders()" style="padding: 8px 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; background: #16213e; color: #fff;">
                <option value="">全部状态</option>
                <option value="pending">待支付</option>
                <option value="confirmed">已确认</option>
                <option value="completed">已完成</option>
            </select>
            <button class="btn" onclick="exportOrders()" style="background: rgba(255,255,255,0.1); color: #fff;">导出订单</button>
        </div>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>订单号</th>
                <th>用户</th>
                <th>金额</th>
                <th>状态</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="orderTableBody">
            <tr>
                <td colspan="6" style="text-align: center; color: #888;">加载中...</td>
            </tr>
        </tbody>
    </table>

    <div class="pagination" id="pagination" style="margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 10px;">
    </div>
</div>

<div id="orderModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3 class="modal-title">订单详情</h3>
        <div id="orderDetail" style="color: #fff; line-height: 2;"></div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn" onclick="closeModal()" style="flex: 1; background: rgba(255,255,255,0.1); color: #fff;">关闭</button>
        </div>
    </div>
</div>

<script>
var currentPage = 1;
var pageSize = 10;
var totalPages = 1;
var total = 0;
var allOrders = [];

window.ordersInit = function() {
    loadOrders();
};

function loadOrders() {
    var adminToken = localStorage.getItem('adminToken');
    var status = document.getElementById('filterStatus').value;
    
    fetch('/admin/orders?page=' + currentPage + '&pageSize=' + pageSize, {
        headers: { 'token': adminToken }
    })
    .then(response => response.json())
    .then(result => {
        if (result.code === 1) {
            var data = JSON.parse(result.data);
            allOrders = data.list || [];
            total = data.total || 0;
            totalPages = data.totalPages || 1;
            
            var filteredOrders = allOrders;
            if (status) {
                filteredOrders = allOrders.filter(function(o) { return o.status === status; });
            }
            
            renderOrders(filteredOrders);
            renderPagination();
        } else {
            document.getElementById('orderTableBody').innerHTML = '<tr><td colspan="6" style="text-align: center; color: #888;">暂无数据</td></tr>';
        }
    })
    .catch(function() {
        document.getElementById('orderTableBody').innerHTML = '<tr><td colspan="6" style="text-align: center; color: #888;">加载失败</td></tr>';
    });
}

function renderOrders(orders) {
    var tbody = document.getElementById('orderTableBody');
    
    if (!orders || orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #888;">暂无数据</td></tr>';
        return;
    }
    
    var html = orders.map(function(order) {
        var statusClass = getStatusClass(order.status);
        var statusText = getStatusText(order.status);
        var date = order.created_at ? new Date(order.created_at).toLocaleString('zh-CN') : '-';
        
        var confirmBtn = order.status === 'pending' ? 
            '<button class="action-btn edit" onclick="confirmOrder(\'' + order.order_id + '\')">确认</button>' : '';
        
        return '<tr>' +
            '<td>' + (order.order_no || order.order_id) + '</td>' +
            '<td>' + (order.username || '-') + '</td>' +
            '<td>¥' + (order.price || 0) + '</td>' +
            '<td><span class="status-badge ' + statusClass + '">' + statusText + '</span></td>' +
            '<td>' + date + '</td>' +
            '<td><div class="action-btns">' +
                '<button class="action-btn edit" onclick="viewOrder(\'' + order.order_id + '\')">查看</button>' +
                confirmBtn +
            '</div></td>' +
        '</tr>';
    }).join('');
    
    tbody.innerHTML = html;
}

function renderPagination() {
    var pagination = document.getElementById('pagination');
    
    if (totalPages <= 1) {
        pagination.innerHTML = '<span style="color: #888;">共 ' + total + ' 条记录</span>';
        return;
    }
    
    var html = '<span style="color: #888;">共 ' + total + ' 条</span>';
    html += '<button class="page-btn" onclick="goToPage(1)" ' + (currentPage === 1 ? 'disabled' : '') + '>首页</button>';
    html += '<button class="page-btn" onclick="goToPage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>上一页</button>';
    html += '<span style="color: #fff;">第 ' + currentPage + ' / ' + totalPages + ' 页</span>';
    html += '<button class="page-btn" onclick="goToPage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>下一页</button>';
    html += '<button class="page-btn" onclick="goToPage(' + totalPages + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>末页</button>';
    
    pagination.innerHTML = html;
}

function goToPage(page) {
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    loadOrders();
}

function getStatusClass(status) {
    var classes = {
        'completed': 'status-active',
        'confirmed': 'status-active',
        'pending': 'status-inactive'
    };
    return classes[status] || 'status-inactive';
}

function getStatusText(status) {
    var texts = {
        'completed': '已完成',
        'confirmed': '已确认',
        'pending': '待支付'
    };
    return texts[status] || '未知';
}

function viewOrder(orderId) {
    var adminToken = localStorage.getItem('adminToken');
    fetch('/order/detail?orderId=' + orderId, {
        headers: { 'token': adminToken }
    })
    .then(response => response.json())
    .then(result => {
        if (result.code === 1) {
            var order = JSON.parse(result.data);
            var detail = '<p><strong>订单号：</strong>' + (order.order_no || order.order_id) + '</p>' +
                         '<p><strong>用户：</strong>' + (order.username || '-') + '</p>' +
                         '<p><strong>金额：</strong>¥' + (order.price || 0) + '</p>' +
                         '<p><strong>状态：</strong>' + getStatusText(order.status) + '</p>' +
                         '<p><strong>创建时间：</strong>' + (order.created_at ? new Date(order.created_at).toLocaleString('zh-CN') : '-') + '</p>';
            document.getElementById('orderDetail').innerHTML = detail;
            document.getElementById('orderModal').style.display = 'flex';
        } else {
            alert(result.data || '获取订单详情失败');
        }
    })
    .catch(function() {
        alert('获取订单详情失败');
    });
}

function closeModal() {
    document.getElementById('orderModal').style.display = 'none';
}

function confirmOrder(orderId) {
    if (!confirm('确定要确认订单 ' + orderId + ' 吗？')) return;
    
    var adminToken = localStorage.getItem('adminToken');
    fetch('/order/confirm', {
        method: 'POST',
        headers: {
            'token': adminToken,
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: 'orderId=' + orderId
    })
    .then(response => response.json())
    .then(result => {
        if (result.code === 1) {
            alert('确认成功');
            loadOrders();
        } else {
            alert(result.data || '确认失败');
        }
    })
    .catch(function() {
        alert('确认失败');
    });
}

function exportOrders() {
    var adminToken = localStorage.getItem('adminToken');
    fetch('/admin/orders/export', {
        headers: { 'token': adminToken }
    })
    .then(response => response.blob())
    .then(blob => {
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'orders_' + new Date().toISOString().slice(0, 10) + '.csv';
        link.click();
        URL.revokeObjectURL(link.href);
    })
    .catch(function() {
        alert('导出失败');
    });
}
</script>

<style>
.page-btn {
    padding: 6px 12px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    cursor: pointer;
    transition: all 0.3s;
}

.page-btn:hover:not(:disabled) {
    background: rgba(76, 175, 80, 0.2);
    border-color: rgba(76, 175, 80, 0.3);
}

.page-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
</style>
