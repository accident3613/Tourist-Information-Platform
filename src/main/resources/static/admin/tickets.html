<!-- 门票管理页面 -->
<div class="content-card">
    <div class="card-header">
        <h3 class="card-title">门票列表</h3>
        <div style="display: flex; gap: 10px;">
            <select id="filterSite" onchange="loadTickets()" style="padding: 8px 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; background: #16213e; color: #fff;">
                <option value="">全部景点</option>
            </select>
            <button class="btn btn-primary" onclick="openAddModal()">+ 新增门票</button>
        </div>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>门票名称</th>
                <th>所属景点</th>
                <th>价格</th>
                <th>库存</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="ticketTableBody">
            <tr>
                <td colspan="7" style="text-align: center; color: #888;">加载中...</td>
            </tr>
        </tbody>
    </table>

    <div class="pagination" id="pagination" style="margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 10px;">
    </div>
</div>

<div id="ticketModal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 500px;">
        <h3 class="modal-title" id="modalTitle">新增门票</h3>
        <div style="margin-bottom: 15px;">
            <label style="color: #888; display: block; margin-bottom: 5px;">门票名称</label>
            <input type="text" id="ticketName" style="width: 100%; padding: 10px; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; background: rgba(255,255,255,0.05); color: #fff;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="color: #888; display: block; margin-bottom: 5px;">所属景点</label>
            <select id="ticketSiteId" style="width: 100%; padding: 10px; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; background: #16213e; color: #fff;">
                <option value="">请选择景点</option>
            </select>
        </div>
        <div style="margin-bottom: 15px;">
            <label style="color: #888; display: block; margin-bottom: 5px;">价格</label>
            <input type="number" id="ticketPrice" min="0" step="0.01" style="width: 100%; padding: 10px; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; background: rgba(255,255,255,0.05); color: #fff;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="color: #888; display: block; margin-bottom: 5px;">库存</label>
            <input type="number" id="ticketStock" min="0" style="width: 100%; padding: 10px; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; background: rgba(255,255,255,0.05); color: #fff;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="color: #888; display: block; margin-bottom: 5px;">描述</label>
            <textarea id="ticketDescription" rows="3" style="width: 100%; padding: 10px; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; background: rgba(255,255,255,0.05); color: #fff; resize: vertical;"></textarea>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn" onclick="closeModal()" style="flex: 1; background: rgba(255,255,255,0.1); color: #fff;">取消</button>
            <button class="btn btn-primary" onclick="saveTicket()" style="flex: 1;">保存</button>
        </div>
    </div>
</div>

<script>
var currentPage = 1;
var pageSize = 10;
var totalPages = 1;
var total = 0;
var editingId = null;
var sites = [];

window.ticketsInit = function() {
    loadSites();
};

function loadSites() {
    var adminToken = localStorage.getItem('adminToken');
    fetch('/site/list?start=0', {
        headers: { 'token': adminToken }
    })
    .then(response => response.json())
    .then(data => {
        sites = data || [];
        var siteSelect = document.getElementById('filterSite');
        var modalSiteSelect = document.getElementById('ticketSiteId');
        
        var options = '<option value="">全部景点</option>';
        var modalOptions = '<option value="">请选择景点</option>';
        
        sites.forEach(function(site) {
            options += '<option value="' + site.id + '">' + site.name + '</option>';
            modalOptions += '<option value="' + site.id + '">' + site.name + '</option>';
        });
        
        siteSelect.innerHTML = options;
        modalSiteSelect.innerHTML = modalOptions;
        
        loadTickets();
    })
    .catch(function() {
        loadTickets();
    });
}

function loadTickets() {
    var adminToken = localStorage.getItem('adminToken');
    var siteId = document.getElementById('filterSite').value;
    
    var url = '/ticket/admin/list?page=' + currentPage + '&pageSize=' + pageSize;
    if (siteId) {
        url += '&siteId=' + siteId;
    }
    
    fetch(url, {
        headers: { 'token': adminToken }
    })
    .then(response => response.json())
    .then(result => {
        if (result.code === 1) {
            var data = JSON.parse(result.data);
            var tickets = data.list || data;
            
            if (Array.isArray(data) && data[0] && data[0].id) {
                tickets = data;
                total = data.length;
                totalPages = 1;
            } else {
                total = data.total || 0;
                totalPages = data.totalPages || 1;
            }
            
            if (siteId && Array.isArray(tickets)) {
                tickets = tickets.filter(function(t) { return t.site_id == siteId; });
            }
            
            renderTickets(tickets);
            renderPagination();
        } else {
            document.getElementById('ticketTableBody').innerHTML = '<tr><td colspan="7" style="text-align: center; color: #888;">暂无数据</td></tr>';
        }
    })
    .catch(function() {
        document.getElementById('ticketTableBody').innerHTML = '<tr><td colspan="7" style="text-align: center; color: #888;">加载失败</td></tr>';
    });
}

function renderTickets(tickets) {
    var tbody = document.getElementById('ticketTableBody');
    
    if (!tickets || tickets.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #888;">暂无数据</td></tr>';
        return;
    }
    
    var html = tickets.map(function(ticket) {
        var siteName = getSiteName(ticket.site_id);
        var statusClass = ticket.status === 1 ? 'status-active' : 'status-inactive';
        var statusText = ticket.status === 1 ? '上架' : '下架';
        
        return '<tr>' +
            '<td>' + ticket.id + '</td>' +
            '<td>' + escapeHtml(ticket.name) + '</td>' +
            '<td>' + siteName + '</td>' +
            '<td>¥' + (ticket.price || 0) + '</td>' +
            '<td>' + (ticket.stock || 0) + '</td>' +
            '<td><span class="status-badge ' + statusClass + '">' + statusText + '</span></td>' +
            '<td><div class="action-btns">' +
                '<button class="action-btn edit" onclick="editTicket(' + ticket.id + ', \'' + escapeHtml(ticket.name) + '\', ' + ticket.site_id + ', ' + ticket.price + ', ' + ticket.stock + ', \'' + escapeHtml(ticket.description || '') + '\')">编辑</button>' +
                '<button class="action-btn delete" onclick="deleteTicket(' + ticket.id + ', \'' + escapeHtml(ticket.name) + '\')">删除</button>' +
            '</div></td>' +
        '</tr>';
    }).join('');
    
    tbody.innerHTML = html;
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
}

function getSiteName(siteId) {
    if (!siteId) return '-';
    var site = sites.find(function(s) { return s.id == siteId; });
    return site ? site.name : '-';
}

function renderPagination() {
    var pagination = document.getElementById('pagination');
    
    if (totalPages <= 1) {
        pagination.innerHTML = '<span style="color: #888;">共 ' + total + ' 条记录</span>';
        return;
    }
    
    var html = '<span style="color: #888;">共 ' + total + ' 条</span>';
    html += '<button class="page-btn" onclick="goToPage(1)" ' + (currentPage === 1 ? 'disabled' : '') + '>首页</button>';
    html += '<button class="page-btn" onclick="goToPage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>上一页</button>';
    html += '<span style="color: #fff;">第 ' + currentPage + ' / ' + totalPages + ' 页</span>';
    html += '<button class="page-btn" onclick="goToPage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>下一页</button>';
    html += '<button class="page-btn" onclick="goToPage(' + totalPages + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>末页</button>';
    
    pagination.innerHTML = html;
}

function goToPage(page) {
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    loadTickets();
}

function openAddModal() {
    editingId = null;
    document.getElementById('modalTitle').textContent = '新增门票';
    document.getElementById('ticketName').value = '';
    document.getElementById('ticketSiteId').value = '';
    document.getElementById('ticketPrice').value = '';
    document.getElementById('ticketStock').value = '';
    document.getElementById('ticketDescription').value = '';
    document.getElementById('ticketModal').style.display = 'flex';
}

function editTicket(id, name, siteId, price, stock, description) {
    editingId = id;
    document.getElementById('modalTitle').textContent = '编辑门票';
    document.getElementById('ticketName').value = name || '';
    document.getElementById('ticketSiteId').value = siteId || '';
    document.getElementById('ticketPrice').value = price || '';
    document.getElementById('ticketStock').value = stock || '';
    document.getElementById('ticketDescription').value = description || '';
    document.getElementById('ticketModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('ticketModal').style.display = 'none';
}

function saveTicket() {
    var name = document.getElementById('ticketName').value.trim();
    var siteId = document.getElementById('ticketSiteId').value;
    var price = parseFloat(document.getElementById('ticketPrice').value) || 0;
    var stock = parseInt(document.getElementById('ticketStock').value) || 0;
    var description = document.getElementById('ticketDescription').value.trim();
    
    if (!name || !siteId) {
        alert('请填写门票名称和所属景点');
        return;
    }
    
    var data = {
        name: name,
        site_id: parseInt(siteId),
        price: price,
        stock: stock,
        description: description,
        status: 1
    };
    
    if (editingId) {
        data.id = editingId;
    }
    
    var adminToken = localStorage.getItem('adminToken');
    fetch('/ticket/admin/save', {
        method: 'POST',
        headers: {
            'token': adminToken,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
        if (result.code === 1) {
            alert('保存成功');
            closeModal();
            loadTickets();
        } else {
            alert(result.data || '保存失败');
        }
    })
    .catch(function() {
        alert('保存失败');
    });
}

function deleteTicket(id, name) {
    if (!confirm('确定要删除门票 "' + name + '" 吗？')) return;
    
    var adminToken = localStorage.getItem('adminToken');
    fetch('/ticket/admin/delete/' + id, {
        method: 'DELETE',
        headers: { 'token': adminToken }
    })
    .then(response => response.json())
    .then(result => {
        if (result.code === 1) {
            alert('删除成功');
            loadTickets();
        } else {
            alert(result.data || '删除失败');
        }
    })
    .catch(function() {
        alert('删除失败');
    });
}
</script>

<style>
.page-btn {
    padding: 6px 12px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    cursor: pointer;
    transition: all 0.3s;
}

.page-btn:hover:not(:disabled) {
    background: rgba(76, 175, 80, 0.2);
    border-color: rgba(76, 175, 80, 0.3);
}

.page-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
</style>
