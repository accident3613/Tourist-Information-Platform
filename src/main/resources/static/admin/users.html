<!-- 用户管理页面 -->
<div class="content-card">
    <div class="card-header">
        <h3 class="card-title">用户列表</h3>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="searchInput" placeholder="搜索用户名/昵称" style="padding: 8px 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; background: rgba(255,255,255,0.05); color: #fff;">
            <button class="btn btn-primary" onclick="searchUsers()">搜索</button>
        </div>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>用户名</th>
                <th>昵称</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="usersTable">
            <tr>
                <td colspan="4" style="text-align: center; color: #888;">加载中...</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- 用户详情弹窗 -->
<div id="userModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: #1a1a2e; border-radius: 12px; padding: 30px; width: 90%; max-width: 500px; border: 1px solid rgba(255,255,255,0.1);">
        <h3 style="color: #4CAF50; margin-bottom: 20px;">用户详情</h3>
        <div id="userDetailContent" style="color: #fff; line-height: 2;">
            加载中...
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn" onclick="closeUserModal()" style="flex: 1; background: rgba(255,255,255,0.1); color: #fff;">关闭</button>
        </div>
    </div>
</div>

<script>
(function() {
    let allUsers = [];

    window.usersInit = function() {
        loadUsers();
    };

    window.loadUsers = function() {
        const adminToken = localStorage.getItem('adminToken');
        fetch('/admin/users', {
            headers: { 'token': adminToken }
        })
        .then(response => response.json())
        .then(result => {
            if (result.code === 1) {
                allUsers = JSON.parse(result.data);
                renderUsers();
            } else {
                document.getElementById('usersTable').innerHTML = '<tr><td colspan="4" style="text-align: center; color: #888;">加载失败</td></tr>';
            }
        })
        .catch(() => {
            document.getElementById('usersTable').innerHTML = '<tr><td colspan="4" style="text-align: center; color: #888;">加载失败</td></tr>';
        });
    };

    window.renderUsers = function() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        let filtered = allUsers;
        if (search) {
            filtered = allUsers.filter(u => 
                u.username.toLowerCase().includes(search) || 
                (u.name && u.name.toLowerCase().includes(search))
            );
        }

        const tbody = document.getElementById('usersTable');
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #888;">暂无数据</td></tr>';
            return;
        }

        tbody.innerHTML = filtered.map(user => {
            const statusClass = user.status === 1 ? 'status-active' : 'status-inactive';
            const statusText = user.status === 1 ? '正常' : '禁用';
            return `
                <tr>
                    <td>${user.username}</td>
                    <td>${user.name || '-'}</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td>
                        <div class="action-btns">
                            <button class="action-btn edit" onclick="viewUser('${user.username}')">查看</button>
                            <button class="action-btn ${user.status === 1 ? 'delete' : 'edit'}" onclick="toggleUserStatus('${user.username}', ${user.status})">
                                ${user.status === 1 ? '禁用' : '启用'}
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    };

    window.searchUsers = function() {
        renderUsers();
    };

    window.viewUser = function(username) {
        const user = allUsers.find(u => u.username === username);
        if (!user) return;

        document.getElementById('userDetailContent').innerHTML = `
            <p><strong>用户名：</strong>${user.username}</p>
            <p><strong>昵称：</strong>${user.name || '-'}</p>
            <p><strong>状态：</strong>${user.status === 1 ? '正常' : '禁用'}</p>
        `;
        document.getElementById('userModal').style.display = 'flex';
    };

    window.closeUserModal = function() {
        document.getElementById('userModal').style.display = 'none';
    };

    window.toggleUserStatus = function(username, currentStatus) {
        const newStatus = currentStatus === 1 ? 0 : 1;
        const action = currentStatus === 1 ? '禁用' : '启用';
        if (!confirm(`确定要${action}用户 ${username} 吗？`)) return;

        const adminToken = localStorage.getItem('adminToken');
        fetch('/admin/user/status', {
            method: 'PUT',
            headers: {
                'token': adminToken,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username: username, status: newStatus })
        })
        .then(response => response.json())
        .then(result => {
            if (result.code === 1) {
                alert(`${action}成功`);
                const user = allUsers.find(u => u.username === username);
                if (user) {
                    user.status = newStatus;
                    renderUsers();
                }
            } else {
                alert(result.data || `${action}失败`);
            }
        })
        .catch(() => alert(`${action}失败`));
    };
})();
</script>
