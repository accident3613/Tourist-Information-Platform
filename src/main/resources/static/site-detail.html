<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>景点详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        /* 头部导航 */
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            opacity: 0.8;
        }

        /* 主内容区 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 加载动画 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 景点信息卡片 */
        .site-header {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .site-title {
            font-size: 36px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }

        .site-meta {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
        }

        .meta-icon {
            width: 20px;
            height: 20px;
            fill: #667eea;
        }

        .rating-badge {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        /* 描述区域 */
        .site-description {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .description-text {
            color: #666;
            line-height: 1.8;
            font-size: 16px;
        }

        /* 图片画廊 */
        .gallery-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .gallery-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        /* 返回按钮 */
        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .back-btn:hover {
            background: white;
            color: #667eea;
        }

        /* 图片预览模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .modal-close:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <!-- 头部导航 -->
    <header class="header">
        <div class="logo" onclick="window.location.href='/sites.html'">🌍 探索世界</div>
        <nav class="nav-links">
            <a href="/sites.html">首页</a>
            <a href="/profile.html">个人中心</a>
            <a href="#" onclick="logout()">退出</a>
        </nav>
    </header>

    <!-- 主内容区 -->
    <div class="container">
        <button class="back-btn" onclick="history.back()">← 返回列表</button>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
        </div>

        <div id="content" style="display: none;">
            <!-- 景点基本信息 -->
            <div class="site-header">
                <h1 class="site-title" id="siteName">景点名称</h1>
                <div class="site-meta">
                    <div class="meta-item">
                        <svg class="meta-icon" viewBox="0 0 24 24">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        <span>评分: <span id="siteRating">0.0</span></span>
                    </div>
                    <div class="meta-item">
                        <svg class="meta-icon" viewBox="0 0 24 24">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5z"/>
                        </svg>
                        <span>浏览量: <span id="siteViews">0</span></span>
                    </div>
                    <div class="meta-item">
                        <span class="rating-badge" id="siteARating">★ 0.0</span>
                    </div>
                </div>
            </div>

            <!-- 景点描述 -->
            <div class="site-description">
                <h2 class="section-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#667eea">
                        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                    </svg>
                    景点介绍
                </h2>
                <p class="description-text" id="siteDescription">暂无描述</p>
            </div>

            <!-- 图片画廊 -->
            <div class="gallery-section">
                <h2 class="section-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#667eea">
                        <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                    </svg>
                    景点相册
                </h2>
                <div id="galleryGrid" class="gallery-grid">
                    <!-- 图片将在这里动态加载 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 图片预览模态框 -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <img id="modalImage" class="modal-image" src="" alt="预览">
    </div>

    <script>
        // 页面加载时获取数据
        window.onload = function() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            // 从URL获取site_id
            const urlParams = new URLSearchParams(window.location.search);
            const siteId = urlParams.get('site_id');

            if (!siteId) {
                alert('未指定景点ID');
                window.location.href = '/sites.html';
                return;
            }

            loadSiteDetail(siteId, token);
        };

        // 加载景点详情
        function loadSiteDetail(siteId, token) {
            fetch('/site/list1', {
                method: 'POST',
                headers: {
                    'token': token,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `site_id=${siteId}`
            })
            .then(response => {
                if (response.status === 401 || response.status === 403) {
                    return response.text().then(text => {
                        if (text === '用户已在其他地方登录') {
                            alert('您的账号已在其他地方登录，请重新登录');
                        }
                        localStorage.removeItem('token');
                        window.location.href = '/login.html';
                        return null;
                    });
                }
                return response.json();
            })
            .then(siteInfo => {
                if (!siteInfo) return;

                // 填充基本信息
                document.getElementById('siteName').textContent = siteInfo.name || '未知景点';
                document.getElementById('siteRating').textContent = siteInfo.rating || '0.0';
                document.getElementById('siteViews').textContent = siteInfo.number || '0';
                document.getElementById('siteARating').textContent = '★ ' + (siteInfo.arating || '0.0');
                document.getElementById('siteDescription').textContent = siteInfo.description || '暂无描述';

                // 加载景点照片
                loadSiteImages(siteId, token);
            })
            .catch(error => {
                console.error('加载景点详情失败:', error);
                alert('加载景点详情失败');
            });
        }

        // 加载景点照片
        function loadSiteImages(siteId, token) {
            fetch('/site/siteicon', {
                method: 'POST',
                headers: {
                    'token': token,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `site_id=${siteId}`
            })
            .then(response => {
                if (response.status === 401 || response.status === 403) {
                    return null;
                }
                return response.json();
            })
            .then(images => {
                const galleryGrid = document.getElementById('galleryGrid');

                if (!images || images.length === 0) {
                    galleryGrid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📷</div>
                            <p>暂无景点照片</p>
                        </div>
                    `;
                } else {
                    galleryGrid.innerHTML = images.map((img, index) => `
                        <div class="gallery-item" onclick="openModal('${img.image_path}')" style="animation: fadeIn 0.5s ease ${index * 0.1}s both;">
                            <img class="gallery-image" src="${img.image_path}" alt="景点照片" onerror="this.src='/icon/1.png'">
                        </div>
                    `).join('');
                }

                // 隐藏加载动画，显示内容
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            })
            .catch(error => {
                console.error('加载景点照片失败:', error);
                document.getElementById('galleryGrid').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <p>加载照片失败</p>
                    </div>
                `;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            });
        }

        // 打开图片预览
        function openModal(imagePath) {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            modalImage.src = imagePath;
            modal.classList.add('active');
        }

        // 关闭图片预览
        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('active');
        }

        // 退出登录
        function logout() {
            const token = localStorage.getItem('token');
            fetch('/user/logout', {
                method: 'POST',
                headers: { 'token': token }
            })
            .then(() => {
                localStorage.removeItem('token');
                window.location.href = '/login.html';
            })
            .catch(() => {
                localStorage.removeItem('token');
                window.location.href = '/login.html';
            });
        }
    </script>
</body>
</html>
