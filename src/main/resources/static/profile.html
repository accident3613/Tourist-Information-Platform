<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>个人信息</title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5dc;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            color: #8B7355;
            font-size: 28px;
            font-weight: 600;
        }

        .avatar-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar-container {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #D2B48C;
            transition: all 0.3s ease;
        }

        .avatar:hover {
            border-color: #8B7355;
            transform: scale(1.05);
        }

        .avatar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            color: white;
            font-size: 14px;
        }

        .avatar-container:hover .avatar-overlay {
            opacity: 1;
        }

        .avatar-input {
            display: none;
        }

        .info-section {
            margin-bottom: 30px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #8B7355;
            font-weight: 500;
        }

        .info-value {
            color: #333;
        }

        .edit-btn {
            background-color: #8B7355;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        .edit-btn:hover {
            background-color: #6B583F;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .nav-btn {
            flex: 1;
            padding: 12px;
            background-color: #8B7355;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .nav-btn:hover {
            background-color: #6B583F;
        }

        .nav-btn.secondary {
            background-color: #A0957E;
        }

        .nav-btn.secondary:hover {
            background-color: #8B7355;
        }

        /* 编辑弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #8B7355;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #8B7355;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #D2B48C;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8B7355;
            box-shadow: 0 0 0 2px rgba(139, 115, 85, 0.1);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .modal-btn.primary {
            background-color: #8B7355;
            color: white;
        }

        .modal-btn.primary:hover {
            background-color: #6B583F;
        }

        .modal-btn.secondary {
            background-color: #eee;
            color: #333;
        }

        .modal-btn.secondary:hover {
            background-color: #ddd;
        }

        .message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }

        .message.success {
            background-color: rgba(39, 174, 96, 0.1);
            color: #27ae60;
        }

        .message.error {
            background-color: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 收藏功能样式 */
        .collection-section {
            margin-top: 30px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .collection-section h3 {
            color: #8B7355;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .btn-collection {
            background-color: #8B7355;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-collection:hover {
            background-color: #6B583F;
        }

        .collection-list {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .collection-item {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .collection-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .collection-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .collection-description {
            font-size: 12px;
            color: #666;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>个人信息</h2>
        </div>

        <div class="avatar-section">
            <div class="avatar-container" onclick="document.getElementById('avatarInput').click()">
                <img id="avatarImg" src="" alt="头像" class="avatar">
                <div class="avatar-overlay">点击更换头像</div>
            </div>
            <input type="file" id="avatarInput" class="avatar-input" accept="image/*" onchange="uploadAvatar(this)">
        </div>

        <div class="info-section">
            <div class="info-item">
                <span class="info-label">用户名</span>
                <span id="username" class="info-value">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">昵称</span>
                <div>
                    <span id="nickname" class="info-value">-</span>
                    <button class="edit-btn" onclick="openNameModal()">修改</button>
                </div>
            </div>
        </div>

        <!-- 收藏功能 -->
        <div class="collection-section">
            <h3>我的收藏</h3>
            <button class="btn-collection" onclick="loadCollections()">
                <span id="collectionText">查看收藏</span>
                <span id="collectionLoading" class="loading" style="display: none;"></span>
            </button>
            <div id="collectionList" class="collection-list" style="display: none;">
                <!-- 收藏列表将在这里显示 -->
            </div>
        </div>

        <div class="nav-buttons">
            <button class="nav-btn secondary" onclick="window.location.href='/sites.html'">返回首页</button>
            <button class="nav-btn" onclick="logout()">退出登录</button>
        </div>
    </div>

    <!-- 修改昵称弹窗 -->
    <div id="nameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>修改昵称</h3>
            </div>
            <div class="form-group">
                <label for="newName">新昵称</label>
                <input type="text" id="newName" placeholder="请输入新昵称">
            </div>
            <div id="nameMessage" class="message" style="display: none;"></div>
            <div class="modal-buttons">
                <button class="modal-btn secondary" onclick="closeNameModal()">取消</button>
                <button class="modal-btn primary" onclick="updateName()">
                    <span id="saveText">保存</span>
                    <span id="saveLoading" class="loading" style="display: none;"></span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // 页面加载时获取用户信息
        window.onload = function() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login.html';
                return;
            }
            loadUserProfile();
        };

        // 使用token加载头像
        function loadAvatarWithToken(iconPath) {
            const token = localStorage.getItem('token');
            // 从icon路径中提取文件名
            const iconFileName = iconPath.split('/').pop();
            
            fetch('/icon?filePath=' + iconFileName, {
                method: 'GET',
                headers: {
                    'token': token
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('头像加载失败');
                }
                return response.blob();
            })
            .then(blob => {
                // 创建Blob URL并设置为头像
                const avatarUrl = URL.createObjectURL(blob);
                document.getElementById('avatarImg').src = avatarUrl;
            })
            .catch(error => {
                console.error('加载头像失败:', error);
                // 加载失败时使用默认头像
                document.getElementById('avatarImg').src = '/icon/1.png';
            });
        }

        // 加载用户信息
        function loadUserProfile() {
            const token = localStorage.getItem('token');
            
            fetch('/user/profile', {
                method: 'GET',
                headers: {
                    'token': token
                }
            })
            .then(response => {
                if (response.status === 401 || response.status === 403) {
                    return response.text().then(text => {
                        if (text === '用户已在其他地方登录') {
                            alert('您的账号已在其他地方登录，请重新登录');
                        }
                        localStorage.removeItem('token');
                        window.location.href = '/login.html';
                        return null;
                    });
                }
                return response.json();
            })
            .then(data => {
                if (data) {
                    document.getElementById('username').textContent = data.username || '-';
                    document.getElementById('nickname').textContent = data.name || data.username || '-';
                    
                    // 加载头像 - 先检查icon路径是否为空
                    if (data.icon && data.icon.trim() !== '') {
                        // icon路径不为空，使用用户头像
                        loadAvatarWithToken(data.icon);
                    } else {
                        // icon路径为空，使用默认头像
                        document.getElementById('avatarImg').src = '/icon/1.png';
                    }
                }
            })
            .catch(error => {
                console.error('获取用户信息失败:', error);
            });
        }

        // 上传头像
        function uploadAvatar(input) {
            if (!input.files || input.files.length === 0) {
                return;
            }

            const file = input.files[0];
            const token = localStorage.getItem('token');
            
            const formData = new FormData();
            formData.append('file', file);

            fetch('/upload', {
                method: 'POST',
                headers: {
                    'token': token
                },
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                if (data === 'false') {
                    alert('未登录或登录已过期，请重新登录');
                    window.location.href = '/login.html';
                } else if (data.includes('successfully')) {
                    // 上传成功后，重新请求profile获取最新头像文件名，然后使用token加载
                    fetch('/user/profile', {
                        method: 'GET',
                        headers: {
                            'token': token
                        }
                    })
                    .then(response => response.json())
                    .then(userData => {
                        if (userData && userData.icon) {
                            loadAvatarWithToken(userData.icon);
                            alert('头像上传成功！');
                        }
                    })
                    .catch(error => {
                        console.error('获取最新头像失败:', error);
                        alert('头像上传成功！');
                    });
                } else {
                    alert('上传失败: ' + data);
                }
            })
            .catch(error => {
                console.error('上传头像失败:', error);
                alert('上传失败，请稍后重试');
            });
        }

        // 打开修改昵称弹窗
        function openNameModal() {
            const currentName = document.getElementById('nickname').textContent;
            document.getElementById('newName').value = currentName === '-' ? '' : currentName;
            document.getElementById('nameModal').style.display = 'flex';
            document.getElementById('nameMessage').style.display = 'none';
        }

        // 关闭修改昵称弹窗
        function closeNameModal() {
            document.getElementById('nameModal').style.display = 'none';
        }

        // 更新昵称
        function updateName() {
            const newName = document.getElementById('newName').value.trim();
            const nameMessage = document.getElementById('nameMessage');
            const saveText = document.getElementById('saveText');
            const saveLoading = document.getElementById('saveLoading');
            
            if (!newName) {
                nameMessage.textContent = '请输入新昵称';
                nameMessage.className = 'message error';
                nameMessage.style.display = 'block';
                return;
            }

            const token = localStorage.getItem('token');
            
            saveText.style.display = 'none';
            saveLoading.style.display = 'inline-block';
            nameMessage.style.display = 'none';

            fetch('/user/update-name?name=' + encodeURIComponent(newName), {
                method: 'PUT',
                headers: {
                    'token': token
                }
            })
            .then(response => response.json())
            .then(data => {
                saveText.style.display = 'inline';
                saveLoading.style.display = 'none';
                
                if (data.code === 1) {
                    nameMessage.textContent = '修改成功！';
                    nameMessage.className = 'message success';
                    nameMessage.style.display = 'block';
                    
                    // 更新页面显示
                    document.getElementById('nickname').textContent = newName;
                    
                    // 关闭弹窗
                    setTimeout(() => {
                        closeNameModal();
                    }, 1500);
                } else {
                    nameMessage.textContent = data.data || '修改失败';
                    nameMessage.className = 'message error';
                    nameMessage.style.display = 'block';
                }
            })
            .catch(error => {
                saveText.style.display = 'inline';
                saveLoading.style.display = 'none';
                nameMessage.textContent = '网络错误，请稍后重试';
                nameMessage.className = 'message error';
                nameMessage.style.display = 'block';
                console.error('修改昵称失败:', error);
            });
        }

        // 加载收藏列表
        function loadCollections() {
            const token = localStorage.getItem('token');
            const collectionText = document.getElementById('collectionText');
            const collectionLoading = document.getElementById('collectionLoading');
            const collectionList = document.getElementById('collectionList');
            
            collectionText.style.display = 'none';
            collectionLoading.style.display = 'inline-block';
            collectionList.style.display = 'none';
            
            // 1. 获取收藏列表
            fetch('/user/colist', {
                method: 'POST',
                headers: {
                    'token': token,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.status === 401 || response.status === 403) {
                    return response.text().then(text => {
                        if (text === '用户已在其他地方登录') {
                            alert('您的账号已在其他地方登录，请重新登录');
                        }
                        localStorage.removeItem('token');
                        window.location.href = '/login.html';
                        return null;
                    });
                }
                return response.json();
            })
            .then(siteIds => {
                if (!siteIds || siteIds.length === 0) {
                    collectionList.innerHTML = '<p style="text-align: center; color: #666;">暂无收藏</p>';
                    collectionList.style.display = 'block';
                    return;
                }
                
                // 2. 获取指定景点信息
                const sitePromises = siteIds.map(siteId => 
                    fetch('/site/list1', {
                        method: 'POST',
                        headers: {
                            'token': token,
                            'Content-Type': 'application/x-www-form-urlencoded'
                        },
                        body: `site_id=${siteId}`
                    }).then(response => response.json())
                );
                
                Promise.all(sitePromises)
                    .then(sites => {
                        displayCollections(sites, token);
                    })
                    .catch(error => {
                        console.error('获取景点信息失败:', error);
                        collectionList.innerHTML = '<p style="text-align: center; color: #e74c3c;">加载失败</p>';
                        collectionList.style.display = 'block';
                    });
            })
            .catch(error => {
                console.error('获取收藏列表失败:', error);
                collectionList.innerHTML = '<p style="text-align: center; color: #e74c3c;">加载失败</p>';
                collectionList.style.display = 'block';
            })
            .finally(() => {
                collectionText.style.display = 'inline';
                collectionLoading.style.display = 'none';
            });
        }

        // 显示收藏列表
        function displayCollections(sites, token) {
            const collectionList = document.getElementById('collectionList');
            
            if (!sites || sites.length === 0) {
                collectionList.innerHTML = '<p style="text-align: center; color: #666;">暂无收藏</p>';
                collectionList.style.display = 'block';
                return;
            }
            
            const collectionHTML = sites.map(site => {
                const iconFileName = site.icon ? site.icon.split('/').pop() : null;
                
                return `
                    <div class="collection-item">
                        <img class="collection-image" 
                             data-icon="${iconFileName}" 
                             data-token="${token}"
                             src="/icon/1.png" 
                             alt="${site.name || '景点'}">
                        <div class="collection-name">${site.name || '未知景点'}</div>
                    </div>
                `;
            }).join('');
            
            collectionList.innerHTML = collectionHTML;
            collectionList.style.display = 'grid';
            
            // 加载所有景点图片（只加载一次）
            const images = collectionList.querySelectorAll('.collection-image');
            images.forEach(img => {
                if (img.dataset.icon) {
                    loadSiteIcon(img);
                }
            });
        }

        // 加载景点图片（携带token）
        function loadSiteIcon(imgElement) {
            const iconFileName = imgElement.dataset.icon;
            const token = imgElement.dataset.token;
            
            if (!iconFileName) return;
            
            fetch(`/sicon?filePath=${iconFileName}`, {
                method: 'GET',
                headers: {
                    'token': token
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('图片加载失败');
                }
                return response.blob();
            })
            .then(blob => {
                const imageUrl = URL.createObjectURL(blob);
                imgElement.src = imageUrl;
            })
            .catch(error => {
                console.error('加载景点图片失败:', error);
                // 加载失败时保持默认头像
            });
        }

        // 退出登录
        function logout() {
            const token = localStorage.getItem('token');
            
            // 调用后端登出接口
            fetch('/user/logout', {
                method: 'POST',
                headers: {
                    'token': token
                }
            })
            .then(() => {
                // 无论后端是否成功，都清除本地token并跳转
                localStorage.removeItem('token');
                window.location.href = '/login.html';
            })
            .catch(() => {
                // 即使请求失败也清除本地token
                localStorage.removeItem('token');
                window.location.href = '/login.html';
            });
        }

        // 点击弹窗外部关闭弹窗
        window.onclick = function(event) {
            const modal = document.getElementById('nameModal');
            if (event.target === modal) {
                closeNameModal();
            }
        }
    </script>
</body>
</html>
