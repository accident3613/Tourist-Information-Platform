<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>登录 - Kastools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5dc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #8B7355;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #A0957E;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #8B7355;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #D2B48C;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8B7355;
            box-shadow: 0 0 0 2px rgba(139, 115, 85, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #8B7355;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #6B583F;
        }

        .btn-login:active {
            transform: translateY(1px);
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        .success-message {
            color: #27ae60;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toggle-form {
            text-align: center;
            margin-top: 20px;
            color: #8B7355;
            font-size: 14px;
        }

        .toggle-form a {
            color: #8B7355;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-form a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2 id="formTitle">欢迎登录</h2>
            <p id="formSubtitle">请输入您的用户名和密码</p>
        </div>
        
        <!-- 登录表单 -->
        <form id="loginForm">
            <div class="form-group">
                <label for="loginUsername">用户名</label>
                <input type="text" id="loginUsername" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">密码</label>
                <input type="password" id="loginPassword" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn-login">
                <span id="loginText">登录</span>
                <span id="loginLoading" class="loading" style="display: none;"></span>
            </button>
            <div id="loginError" class="error-message"></div>
        </form>

        <!-- 注册表单 -->
        <form id="registerForm" class="hidden">
            <div class="form-group">
                <label for="registerUsername">用户名</label>
                <input type="text" id="registerUsername" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label for="registerPassword">密码</label>
                <input type="password" id="registerPassword" name="password" placeholder="请输入密码" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码" required>
            </div>
            <button type="submit" class="btn-login">
                <span id="registerText">注册</span>
                <span id="registerLoading" class="loading" style="display: none;"></span>
            </button>
            <div id="registerError" class="error-message"></div>
            <div id="registerSuccess" class="success-message"></div>
        </form>

        <div class="toggle-form">
            <span id="toggleText">还没有账号？</span>
            <a id="toggleLink" onclick="toggleForm()">立即注册</a>
        </div>
    </div>

    <script>
        let isLoginForm = true;

        function toggleForm() {
            isLoginForm = !isLoginForm;
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const formTitle = document.getElementById('formTitle');
            const formSubtitle = document.getElementById('formSubtitle');
            const toggleText = document.getElementById('toggleText');
            const toggleLink = document.getElementById('toggleLink');

            if (isLoginForm) {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                formTitle.textContent = '欢迎登录';
                formSubtitle.textContent = '请输入您的用户名和密码';
                toggleText.textContent = '还没有账号？';
                toggleLink.textContent = '立即注册';
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                formTitle.textContent = '注册账号';
                formSubtitle.textContent = '请填写以下信息完成注册';
                toggleText.textContent = '已有账号？';
                toggleLink.textContent = '立即登录';
            }
        }

        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const loginText = document.getElementById('loginText');
            const loginLoading = document.getElementById('loginLoading');
            const loginError = document.getElementById('loginError');
            
            loginText.style.display = 'none';
            loginLoading.style.display = 'inline-block';
            loginError.textContent = '';
            
            fetch('/user/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            })
            .then(response => response.json())
            .then(data => {
                loginText.style.display = 'inline';
                loginLoading.style.display = 'none';
                
                if (data.code === 1) {
                    localStorage.setItem('token', data.data);
                    window.location.href = '/sites.html';
                } else {
                    loginError.textContent = '用户名或密码错误';
                }
            })
            .catch(error => {
                loginText.style.display = 'inline';
                loginLoading.style.display = 'none';
                loginError.textContent = '网络错误，请稍后重试';
                console.error('登录请求失败:', error);
            });
        });

        // 注册表单提交
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const registerText = document.getElementById('registerText');
            const registerLoading = document.getElementById('registerLoading');
            const registerError = document.getElementById('registerError');
            const registerSuccess = document.getElementById('registerSuccess');
            
            registerError.textContent = '';
            registerSuccess.textContent = '';
            
            if (password !== confirmPassword) {
                registerError.textContent = '两次输入的密码不一致';
                return;
            }
            
            registerText.style.display = 'none';
            registerLoading.style.display = 'inline-block';
            
            fetch('/user/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            })
            .then(response => response.json())
            .then(data => {
                registerText.style.display = 'inline';
                registerLoading.style.display = 'none';
                
                if (data.code === 1) {
                    registerSuccess.textContent = '注册成功！正在跳转到登录...';
                    setTimeout(() => {
                        toggleForm();
                        document.getElementById('loginUsername').value = username;
                        document.getElementById('loginPassword').value = '';
                    }, 1500);
                } else {
                    registerError.textContent = data.data || '注册失败，请稍后重试';
                }
            })
            .catch(error => {
                registerText.style.display = 'inline';
                registerLoading.style.display = 'none';
                registerError.textContent = '网络错误，请稍后重试';
                console.error('注册请求失败:', error);
            });
        });
    </script>
</body>
</html>
